name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ashmit-portfolio
  ECR_REGISTRY: 499133675204.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present


  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # DEBUG GITHUB OIDC CONTEXT
      # ==========================================
      - name: Debug GitHub OIDC context
        run: |
          echo "=========================================="
          echo "GitHub OIDC Debug Information"
          echo "=========================================="
          echo "Repository       : $GITHUB_REPOSITORY"
          echo "Repository ID    : ${{ github.repository_id }}"
          echo "Owner            : ${{ github.repository_owner }}"
          echo "Owner ID         : ${{ github.repository_owner_id }}"
          echo "Ref              : $GITHUB_REF"
          echo "Branch           : $GITHUB_REF_NAME"
          echo "Event            : $GITHUB_EVENT_NAME"
          echo "Commit SHA       : $GITHUB_SHA"
          echo "Workflow         : $GITHUB_WORKFLOW"
          echo "=========================================="


      # ==========================================
      # AWS OIDC AUTHENTICATION
      # ==========================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================
      # VERIFY AWS IDENTITY
      # ==========================================
      - name: Verify AWS identity
        run: |
          echo "=========================================="
          echo "AWS Identity"
          echo "=========================================="
          aws sts get-caller-identity
          echo "=========================================="


      # ==========================================
      # LOGIN TO ECR
      # ==========================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # GENERATE IMMUTABLE IMAGE TAG
      # ==========================================
      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Docker Image Tag"
          echo "=========================================="
          echo "$IMAGE_TAG"
          echo "=========================================="


      # ==========================================
      # BUILD DOCKER IMAGE
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}" \
            .


      # ==========================================
      # PUSH DOCKER IMAGE TO ECR
      # ==========================================
      - name: Push Docker image
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"


  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      # ==========================================
      # DEPLOY TO KIND KUBERNETES VM USING SSH
      # ==========================================
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Starting deployment"
            echo "================================="

            cd ~/ashmit-DevOps-portfolio

            echo "================================="
            echo "Pulling latest GitHub changes"
            echo "================================="

            git pull origin main

            echo "================================="
            echo "Checking Kubernetes"
            echo "================================="

            kubectl get nodes

            echo "================================="
            echo "Checking Helm"
            echo "================================="

            helm version

            echo "================================="
            echo "Deploying image"
            echo "================================="

            echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}"

            helm upgrade --install portfolio ./helm/portfolio \
              --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
              --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
              --wait \
              --timeout 5m

            echo "================================="
            echo "Deployment completed"
            echo "================================="

            echo "================================="
            echo "Pods"
            echo "================================="

            kubectl get pods

            echo "================================="
            echo "Deployment"
            echo "================================="

            kubectl get deployment portfolio-portfolio

            echo "================================="
            echo "Service"
            echo "================================="

            kubectl get service portfolio-portfolio

            echo "================================="
            echo "Ingress"
            echo "================================="

            kubectl get ingress
