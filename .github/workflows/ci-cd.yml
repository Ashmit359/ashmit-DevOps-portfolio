name: Portfolio CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ashmit-portfolio
  ECR_REGISTRY: 499133675204.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Docker image tag: $IMAGE_TAG"

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            echo "================================="
            echo "Starting deployment"
            echo "================================="

            cd ~/ashmit-DevOps-portfolio

            echo "Pulling latest GitHub changes..."
            git pull origin main

            echo "Checking Kubernetes..."
            kubectl get nodes

            echo "Checking Helm..."
            helm version

            echo "Deploying image:"
            echo "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.image_tag }}"

            helm upgrade --install portfolio ./helm/portfolio \
              --set image.repository=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }} \
              --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
              --wait \
              --timeout 5m

            echo "================================="
            echo "Deployment completed"
            echo "================================="

            echo "Pods:"
            kubectl get pods

            echo "Ingress:"
            kubectl get ingress
