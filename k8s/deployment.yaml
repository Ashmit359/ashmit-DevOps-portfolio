apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          # Replace with your image in Amazon ECR, e.g.:
          # <account-id>.dkr.ecr.<region>.amazonaws.com/portfolio:<tag>
          image: "[EDIT: Add container image reference]"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: portfolio-config
          # Secrets (e.g. Gmail credentials) belong in a Kubernetes
          # Secret, never hardcoded here or committed to Git:
          # envFrom:
          #   - secretRef:
          #       name: portfolio-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
