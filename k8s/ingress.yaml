apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    # Example for the AWS Load Balancer Controller on EKS:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    kubernetes.io/ingress.class: "[EDIT: Add ingress class, e.g. alb or nginx]"
spec:
  rules:
    - host: "[EDIT: Add your domain]"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
